<!doctype html>
<html lang="ja" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サイドメニュー(スマホ)</title>
<script>(function(){var t;try{t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('todo-theme')}catch(e){}document.documentElement.setAttribute('data-theme',(t==='pixel'||t==='royal')?t:'blue')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=DotGothic16&amp;family=Press+Start+2P&amp;family=Jacquard+24&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme/tokens.css">
<link rel="stylesheet" href="theme/icons.css">
<link rel="stylesheet" href="theme/base.css">
<link rel="stylesheet" href="theme/app.css">
<script src="theme/theme.js" defer></script>
<style>
.theme-bar{width:390px}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--page)}
/* 背景を暗くする幕(ブルー: 半透明 / ピクセル: 2pxの市松模様) */
.phone::before{content:"";position:absolute;inset:0;background:var(--scrim);background-size:var(--scrim-size);animation:var(--anim-scrim)}
.drawer{position:absolute;top:0;bottom:0;left:0;width:300px;background:var(--surface-sunken);border-right:var(--drawer-border);box-shadow:var(--drawer-shadow);padding:16px 12px 28px;display:flex;flex-direction:column;gap:2px;animation:var(--anim-drawer)}
.brand-row{display:flex;align-items:center;justify-content:space-between;padding:0 0 12px 10px}
.brand-row>div{display:flex;align-items:center;gap:10px}
.brand-row .icon-btn{width:44px;height:44px;border-radius:var(--r-lg)}
.brand-row .icon-btn .ico{--s:20px}
.drawer .nav-item{height:48px;padding-right:12px;gap:12px;border-radius:var(--r-lg)}
.drawer .nav-item .ico{--s:20px}
.drawer .nav-item .count{font-size:var(--fs-count-lg)}
.drawer .nav-item .list-dot{width:12px;height:12px}
.account{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 0 0 12px;border-top:var(--bw) solid var(--line)}
.account .avatar{width:36px;height:36px}
.account .who{flex:1;min-width:0}
.account .name{font-family:var(--font-num);font-weight:var(--fw-ui-strong);font-size:var(--fs-name);line-height:1.6;-webkit-font-smoothing:var(--smoothing-num)}
.account .mail{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout{height:44px;padding:0 12px;border-radius:var(--r-lg);flex-shrink:0;font-size:var(--fs-ui-m);font-weight:var(--fw-ui-medium);background:var(--surface);box-shadow:var(--shadow-logout)}
</style>
</head>
<body>
<div class="theme-bar">
  <span class="ui-label" id="theme-label">テーマ</span>
  <div class="seg theme-switch" role="group" aria-labelledby="theme-label">
    <button type="button" data-theme-set="blue" aria-pressed="true">ブルー</button>
    <button type="button" data-theme-set="pixel" aria-pressed="false">ピクセル</button>
    <button type="button" data-theme-set="royal" aria-pressed="false">ピクセル貴族</button>
  </div>
</div>
<div class="phone">
  <nav class="drawer" aria-label="メインメニュー">
    <div class="brand-row">
      <div>
        <div class="logo-sm"><i class="ico i-logo" style="--s:16px" aria-hidden="true"></i></div>
        <span class="brand-name">シンプルTodo</span>
      </div>
      <a class="icon-btn tap" href="sp-list.html" aria-label="メニューを閉じる"><i class="ico i-close" aria-hidden="true"></i></a>
    </div>
    <a class="nav-item cursor" href="sp-list.html" aria-current="page">
      <i class="ico i-sun" aria-hidden="true"></i>
      <span>今日</span><span class="count">4</span>
    </a>
    <a class="nav-item" href="#">
      <i class="ico i-inbox" aria-hidden="true"></i>
      <span>インボックス</span><span class="count">1</span>
    </a>
    <div class="group-label">リスト</div>
    <a class="nav-item" href="#">
      <span class="list-dot c-work" aria-hidden="true"></span>
      <span>仕事</span><span class="count">3</span>
    </a>
    <a class="nav-item" href="#">
      <span class="list-dot c-shop" aria-hidden="true"></span>
      <span>買い物</span><span class="count">1</span>
    </a>
    <button class="nav-item is-muted" type="button">
      <i class="ico i-plus" aria-hidden="true"></i>リストを追加
    </button>
    <div class="account">
      <div class="avatar" aria-hidden="true">E</div>
      <div class="who">
        <div class="name">Erika</div>
        <div class="mail">erika@example.com</div>
      </div>
      <a class="btn btn-secondary logout tap" href="pc-login.html">ログアウト</a>
    </div>
  </nav>
</div>
</body>
</html>
