<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスク一覧と詳細パネル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=Press+Start+2P&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
/* パレットは8色のみ。濃淡や透明度での派生色も作らない */
:root{
  --ink:#0E1030;    /* ウィンドウ地・影 */
  --win:#23307A;    /* 画面地・入力欄・選択行 */
  --cream:#F4EFD8;  /* 本文・枠線 */
  --dim:#A9B2E8;    /* 補足文字 */
  --gold:#FFD447;   /* カーソル・主ボタン・選択 */
  --red:#FF8A7A;    /* 期限切れ・削除・エラー */
  --orange:#FFAE57; /* 優先度 高・ボタンの段差 */
  --green:#7EE08F;  /* 完了・保存・HPバー */
  --f-pixel:"DotGothic16","Noto Sans JP",sans-serif;
  --f-num:"Press Start 2P","DotGothic16",monospace;
  --f-body:"Noto Sans JP",system-ui,sans-serif;
  --shadow:4px 4px 0 0 var(--ink);
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{-webkit-text-size-adjust:100%;color:var(--cream);background:var(--win)}
body{margin:0;background:var(--win);color:var(--cream);font-family:var(--f-body);font-size:14px;line-height:1.6;font-weight:400}
::selection{background:var(--gold);color:var(--ink)}
h1,h2{margin:0;font-family:var(--f-pixel);font-weight:400;letter-spacing:.02em}
a{color:var(--gold);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit;caret-color:var(--gold)}
::placeholder{color:var(--dim);opacity:1}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.px{font-family:var(--f-pixel);font-weight:400;-webkit-font-smoothing:none}
.n{font-family:var(--f-num);font-size:12px;line-height:1;-webkit-font-smoothing:none}
.pxi{display:block;flex-shrink:0}
.window{background:var(--ink);border:2px solid var(--cream);box-shadow:var(--shadow)}
.swatch{display:inline-block;width:8px;height:8px;flex-shrink:0;background:var(--c)}

/* ボタン: 押すと2pxずれて段差が反転する(カクッと2コマ) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-pixel);font-size:16px;line-height:1;border:2px solid var(--cream);transition:transform 80ms steps(2)}
.btn:active{transform:translate(2px,2px)}
.btn-gold{background:var(--gold);color:var(--ink);box-shadow:inset -4px -4px 0 0 var(--orange)}
.btn-gold:active{box-shadow:inset 4px 4px 0 0 var(--orange)}
.btn-sub{background:var(--ink);color:var(--cream);border-color:var(--dim);box-shadow:inset -2px -2px 0 0 var(--win)}
.btn-danger{background:var(--ink);color:var(--red);border-color:var(--red)}
.icon-btn{display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--cream);border:2px solid transparent;transition:transform 80ms steps(2)}
.icon-btn:active{transform:translate(2px,2px)}

/* RPGのカーソル(▶)。1秒周期で2px揺れる */
.cursor::before{content:"";position:absolute;left:6px;top:50%;width:8px;height:14px;margin-top:-7px;background:var(--gold);-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%204%207'%20shape-rendering%3D'crispEdges'%3E%3Cpath%20d%3D'M0%200h1v1h-1zM0%201h2v1h-2zM0%202h3v1h-3zM0%203h4v1h-4zM0%204h3v1h-3zM0%205h2v1h-2zM0%206h1v1h-1z'%2F%3E%3C%2Fsvg%3E") center/8px 14px no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%204%207'%20shape-rendering%3D'crispEdges'%3E%3Cpath%20d%3D'M0%200h1v1h-1zM0%201h2v1h-2zM0%202h3v1h-3zM0%203h4v1h-4zM0%204h3v1h-3zM0%205h2v1h-2zM0%206h1v1h-1z'%2F%3E%3C%2Fsvg%3E") center/8px 14px no-repeat;animation:bob 1s steps(1) infinite}
@keyframes bob{50%{transform:translateX(2px)}}

@media (hover:hover) and (pointer:fine){
  .btn-gold:hover{background:var(--cream)}
  .btn-sub:hover{background:var(--win);border-color:var(--cream)}
  .btn-danger:hover{background:var(--red);color:var(--ink)}
  .icon-btn:hover{border-color:var(--cream);background:var(--win)}
}
@media (prefers-reduced-motion:reduce){
  .btn:active,.icon-btn:active{transform:none}
  .cursor::before{animation:none}
}
/* ナビ項目(サイドバー/ドロワー共通) */
.nav-item{position:relative;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 22px;border:2px solid transparent;font-family:var(--f-pixel);font-size:16px;line-height:1;color:var(--cream);text-align:left}
.nav-item .ico{color:var(--dim)}
.nav-item .count{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--dim)}
.nav-item .list-dot{width:10px;height:10px;margin:0 4px;flex-shrink:0;background:var(--c)}
.nav-item.is-muted{color:var(--dim)}
.nav-item[aria-current="page"]{background:var(--win);border-color:var(--gold)}
.nav-item[aria-current="page"] .ico,.nav-item[aria-current="page"] .count{color:var(--gold)}
.nav-item:not([aria-current="page"]):active{background:var(--win)}
.group-label{font-family:var(--f-pixel);font-size:14px;color:var(--dim);padding:22px 10px 8px 22px;display:flex;align-items:center;gap:8px}
.group-label::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--dim) 0 2px,transparent 2px 6px)}
.logo-sm{width:30px;height:30px;background:var(--gold);color:var(--ink);border:2px solid var(--cream);box-shadow:inset -2px -2px 0 0 var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-family:var(--f-pixel);font-size:18px;line-height:1}
.avatar{background:var(--gold);color:var(--ink);border:2px solid var(--cream);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:12px;line-height:1;flex-shrink:0}

/* 完了チェック(四角) */
.check{position:relative;width:20px;height:20px;border:2px solid var(--dim);background:var(--ink);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent}
.check::before{content:"";position:absolute;inset:-10px}
.check::after{content:"";width:14px;height:12px;background:currentColor;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%207%206'%20shape-rendering%3D'crispEdges'%3E%3Cpath%20d%3D'M6%200h1v1h-1zM5%201h2v1h-2zM0%202h1v1h-1zM4%202h2v1h-2zM0%203h2v1h-2zM3%203h2v1h-2zM1%204h3v1h-3zM2%205h1v1h-1z'%2F%3E%3C%2Fsvg%3E") center/14px 12px no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%207%206'%20shape-rendering%3D'crispEdges'%3E%3Cpath%20d%3D'M6%200h1v1h-1zM5%201h2v1h-2zM0%202h1v1h-1zM4%202h2v1h-2zM0%203h2v1h-2zM3%203h2v1h-2zM1%204h3v1h-3zM2%205h1v1h-1z'%2F%3E%3C%2Fsvg%3E") center/14px 12px no-repeat}
.check.is-high{border-color:var(--orange)}
.check.is-done{background:var(--gold);border-color:var(--gold);color:var(--ink)}
button.check{transition:transform 80ms steps(2)}
button.check:active{transform:translate(2px,2px)}

/* セグメント(絞り込み・優先度) */
.seg{display:flex;border:2px solid var(--cream);background:var(--ink)}
.seg>button{font-family:var(--f-pixel);font-size:16px;line-height:1;color:var(--cream);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px}
.seg>button+button{border-left:2px solid var(--win)}
.seg>button[aria-selected="true"],.seg>button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.seg>button.is-high[aria-pressed="true"]{background:var(--orange)}

/* タスク行 */
.task{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 26px;border:2px solid transparent;color:var(--cream)}
.task::after{content:"";position:absolute;left:58px;right:12px;bottom:-2px;height:2px;background:repeating-linear-gradient(90deg,var(--win) 0 4px,transparent 4px 8px)}
.task:last-child::after,.task.is-selected::after,.task:has(+ .task.is-selected)::after{display:none}
.task.is-selected{background:var(--win);border-color:var(--gold)}
.task-body{flex:1;min-width:0}
.task-title{font-size:15px;line-height:1.5}
.task-title.is-strong{font-weight:500}
.task.is-done .task-title{color:var(--dim);text-decoration:line-through;text-decoration-thickness:2px}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;font-size:12px;line-height:1.5;color:var(--dim)}
.meta>span{display:inline-flex;align-items:center;gap:6px}
.meta .is-overdue{color:var(--red);font-family:var(--f-pixel);font-size:14px;line-height:1}
.flag{color:var(--orange)}
.sec-h{margin:0 0 6px;font-size:16px;line-height:1.2;color:var(--cream);display:flex;align-items:center;gap:10px}
.sec-h .n{color:var(--dim)}
.sec-h.is-danger,.sec-h.is-danger .n{color:var(--red)}

/* HPバー風の進捗 */
.bar{flex:1;height:16px;border:2px solid var(--cream);background:var(--ink);padding:2px}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 6px,transparent 6px 8px)}

@media (hover:hover) and (pointer:fine){
  .nav-item:not([aria-current="page"]):hover{background:var(--win)}
  .check:hover{border-color:var(--cream);color:var(--dim)}
  .check.is-high:hover{border-color:var(--orange);color:var(--orange)}
  .check.is-done:hover{background:var(--cream);border-color:var(--cream);color:var(--ink)}
  .seg>button:not([aria-selected="true"]):not([aria-pressed="true"]):hover{background:var(--win)}
  .task:not(.is-selected):hover{background:var(--win)}
  .task:hover::after,.task:has(+ .task:hover)::after{display:none}
}
@media (prefers-reduced-motion:reduce){button.check:active{transform:none}}
.app{min-height:100vh;display:flex;flex-wrap:wrap;gap:16px;padding:16px 20px 20px 16px;align-items:stretch}

/* サイドバー */
.sidebar{flex:1 1 236px;max-width:256px;min-width:220px;padding:16px 10px 12px;display:flex;flex-direction:column;gap:4px}
.sidebar .brand-row{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.account{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 0 0 8px;border-top:2px solid var(--win)}
.account .avatar{width:32px;height:32px}
.account .who{flex:1;min-width:0}
.account .name{font-family:var(--f-num);font-size:12px;line-height:1.6}
.account .mail{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account .icon-btn{width:34px;height:34px}

/* メイン */
.main{flex:999 1 440px;min-width:0;padding:28px 32px 36px}
.main-inner{max-width:720px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.title-row{display:flex;align-items:baseline;gap:14px}
.page-head h1{font-size:32px;line-height:1.1}
.date{font-family:var(--f-pixel);font-size:16px;color:var(--dim)}
.progress{display:flex;align-items:center;gap:12px;min-width:240px;padding-bottom:4px}
.progress .label{font-family:var(--f-pixel);font-size:14px;color:var(--dim);white-space:nowrap;display:flex;align-items:baseline;gap:4px}
.progress .label .n{color:var(--green)}

.quick{margin-top:24px;border:2px solid var(--cream);background:var(--win);padding:6px 6px 6px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.quick:focus-within{border-color:var(--gold)}
.quick>.pxi{color:var(--gold)}
.quick input{flex:1 1 200px;border:0;outline:none;padding:9px 0;font-size:15px;background:transparent}
.chip{height:36px;padding:0 10px;font-size:14px}
.chip .pxi{color:var(--dim)}
.btn-add{height:36px;padding:0 16px}

.tabs{display:inline-flex;margin-top:20px}
.tabs>button{height:36px;padding:0 14px}

.section{margin-top:28px}
.toggle{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 8px;margin:0 0 6px -8px;border:2px solid transparent;font-family:var(--f-pixel);font-size:16px;color:var(--dim)}
.toggle:active{background:var(--win)}

/* 詳細パネル */
.panel{flex:1 1 340px;max-width:360px;display:flex;flex-direction:column}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px 22px}
.crumb{font-family:var(--f-pixel);font-size:14px;color:var(--dim);display:flex;align-items:center;gap:8px}
.panel-head .icon-btn{width:36px;height:36px}
.panel-body{padding:6px 22px 22px;flex:1}
.title-wrap{display:flex;gap:12px;align-items:flex-start}
.title-wrap .check{width:24px;height:24px;margin-top:3px}
.panel h2{font-size:24px;line-height:1.3}
.props{margin:24px 0 0;display:grid;grid-template-columns:76px minmax(0,1fr);row-gap:14px;align-items:center}
.props dt{font-family:var(--f-pixel);font-size:16px;color:var(--dim)}
.props dd{margin:0}
.due{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:2px solid var(--red);color:var(--red);font-family:var(--f-pixel);font-size:14px}
.prio{width:fit-content}
.prio>button{height:32px;min-width:44px;padding:0 12px}
.select-btn{height:34px;padding:0 10px;font-size:16px}
.select-btn .pxi{color:var(--dim)}
.memo-label{display:block;margin-top:26px;font-family:var(--f-pixel);font-size:16px;color:var(--dim)}
.memo{display:block;margin-top:8px;width:100%;border:2px solid var(--dim);padding:12px;resize:vertical;font-size:14px;line-height:1.7;background:var(--win);outline:none}
.memo:focus{border-color:var(--gold);outline:2px solid var(--gold);outline-offset:2px}
.counter{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;color:var(--dim)}
.panel-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 22px;border-top:2px solid var(--win);font-size:12px;color:var(--dim)}
.saved{display:flex;align-items:center;gap:8px;color:var(--green)}
.panel-foot .btn-danger{height:36px;padding:0 12px;font-size:14px}

@media (hover:hover) and (pointer:fine){
  .toggle:hover{background:var(--win);color:var(--cream)}
  .quick:hover:not(:focus-within){border-color:var(--cream)}
  .memo:hover:not(:focus){border-color:var(--cream)}
}
</style>
</head>
<body>
<div class="app">

  <!-- サイドバー -->
  <nav class="sidebar window" aria-label="メインメニュー">
    <div class="brand-row">
      <div class="logo-sm"><svg class="pxi" width="18" height="14" viewBox="0 0 9 7" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M8 0h1v1h-1zM7 1h2v1h-2zM6 2h2v1h-2zM0 3h1v1h-1zM5 3h2v1h-2zM0 4h2v1h-2zM4 4h2v1h-2zM1 5h4v1h-4zM2 6h2v1h-2z"/></svg></div>
      <span class="brand-name">シンプルTodo</span>
    </div>
    <a class="nav-item cursor" href="#" aria-current="page">
      <span class="ico"><svg class="pxi" width="18" height="18" viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h1v1h-1zM1 1h1v1h-1zM7 1h1v1h-1zM3 2h3v1h-3zM2 3h5v1h-5zM0 4h1v1h-1zM2 4h5v1h-5zM8 4h1v1h-1zM2 5h5v1h-5zM3 6h3v1h-3zM1 7h1v1h-1zM7 7h1v1h-1zM4 8h1v1h-1z"/></svg></span>
      <span>今日</span><span class="count">4</span>
    </a>
    <a class="nav-item" href="#">
      <span class="ico"><svg class="pxi" width="18" height="16" viewBox="0 0 9 8" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h7v1h-7zM1 1h1v1h-1zM7 1h1v1h-1zM0 2h1v1h-1zM8 2h1v1h-1zM0 3h1v1h-1zM8 3h1v1h-1zM0 4h3v1h-3zM6 4h3v1h-3zM0 5h1v1h-1zM3 5h3v1h-3zM8 5h1v1h-1zM0 6h1v1h-1zM8 6h1v1h-1zM0 7h9v1h-9z"/></svg></span>
      <span>インボックス</span><span class="count">1</span>
    </a>
    <div class="group-label">リスト</div>
    <a class="nav-item" href="#">
      <span class="list-dot" style="--c:var(--dim)" aria-hidden="true"></span>
      <span>仕事</span><span class="count">3</span>
    </a>
    <a class="nav-item" href="#">
      <span class="list-dot" style="--c:var(--green)" aria-hidden="true"></span>
      <span>買い物</span><span class="count">1</span>
    </a>
    <button class="nav-item is-muted" type="button">
      <span class="ico"><svg class="pxi" width="18" height="18" viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h1v1h-1zM4 1h1v1h-1zM4 2h1v1h-1zM4 3h1v1h-1zM0 4h9v1h-9zM4 5h1v1h-1zM4 6h1v1h-1zM4 7h1v1h-1zM4 8h1v1h-1z"/></svg></span>
      リストを追加
    </button>
    <div class="account">
      <div class="avatar" aria-hidden="true">E</div>
      <div class="who">
        <div class="name">Erika</div>
        <div class="mail">erika@example.com</div>
      </div>
      <button class="icon-btn" type="button" aria-label="アカウントメニュー"><svg class="pxi" width="20" height="4" viewBox="0 0 10 2" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h2v1h-2zM4 0h2v1h-2zM8 0h2v1h-2zM0 1h2v1h-2zM4 1h2v1h-2zM8 1h2v1h-2z"/></svg></button>
    </div>
  </nav>

  <!-- メイン -->
  <main class="main window">
    <div class="main-inner">
      <header class="page-head">
        <div class="title-row">
          <h1>今日</h1>
          <span class="date">11月17日(火)</span>
        </div>
        <div class="progress">
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1" aria-label="今日の進み具合"><i style="width:20%"></i></div>
          <span class="label"><span class="n">5</span>件中 <span class="n">1</span>件完了</span>
        </div>
      </header>

      <!-- クイック追加 -->
      <form class="quick">
        <svg class="pxi" width="18" height="18" viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 0h1v1h-1zM4 1h1v1h-1zM4 2h1v1h-1zM4 3h1v1h-1zM0 4h9v1h-9zM4 5h1v1h-1zM4 6h1v1h-1zM4 7h1v1h-1zM4 8h1v1h-1z"/></svg>
        <label class="sr-only" for="quick-add">新しいタスク</label>
        <input id="quick-add" placeholder="今日やることを追加" autocomplete="off">
        <button class="btn btn-sub chip" type="button"><svg class="pxi" width="14" height="14" viewBox="0 0 7 7" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h1v1h-1zM5 0h1v1h-1zM0 1h7v1h-7zM0 2h7v1h-7zM0 3h1v1h-1zM6 3h1v1h-1zM0 4h1v1h-1zM2 4h1v1h-1zM4 4h1v1h-1zM6 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM0 6h7v1h-7z"/></svg>今日</button>
        <button class="btn btn-sub chip" type="button"><svg class="pxi" width="18" height="18" viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h8v1h-8zM0 1h7v1h-7zM0 2h6v1h-6zM0 3h7v1h-7zM0 4h8v1h-8zM0 5h1v1h-1zM0 6h1v1h-1zM0 7h1v1h-1zM0 8h1v1h-1z"/></svg>優先度</button>
        <button class="btn btn-gold btn-add" type="submit">追加</button>
      </form>

      <!-- 絞り込み -->
      <div class="seg tabs" role="tablist" aria-label="絞り込み">
        <button type="button" role="tab" aria-selected="false">すべて <span class="n">5</span></button>
        <button type="button" role="tab" aria-selected="true">未完了 <span class="n">4</span></button>
        <button type="button" role="tab" aria-selected="false">完了 <span class="n">1</span></button>
      </div>

      <!-- 期限切れ -->
      <section class="section">
        <h2 class="sec-h is-danger">期限切れ<span class="n">1</span></h2>
        <div class="rows">
          <div class="task is-selected cursor">
            <button class="check is-high" type="button" aria-label="完了にする"></button>
            <div class="task-body">
              <div class="task-title is-strong">請求書を送る</div>
              <div class="meta">
                <span class="is-overdue"><svg class="pxi" width="14" height="14" viewBox="0 0 7 7" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h1v1h-1zM5 0h1v1h-1zM0 1h7v1h-7zM0 2h7v1h-7zM0 3h1v1h-1zM6 3h1v1h-1zM0 4h1v1h-1zM2 4h1v1h-1zM4 4h1v1h-1zM6 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM0 6h7v1h-7z"/></svg>昨日</span>
                <span><i class="swatch" style="--c:var(--dim)"></i>仕事</span>
                <span><svg class="pxi" width="14" height="10" viewBox="0 0 7 5" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h7v1h-7zM0 2h7v1h-7zM0 4h4v1h-4z"/></svg>メモあり</span>
              </div>
            </div>
            <span class="flag"><svg class="pxi" width="18" height="18" viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" role="img" aria-label="優先度 高"><path d="M0 0h8v1h-8zM0 1h7v1h-7zM0 2h6v1h-6zM0 3h7v1h-7zM0 4h8v1h-8zM0 5h1v1h-1zM0 6h1v1h-1zM0 7h1v1h-1zM0 8h1v1h-1z"/></svg></span>
          </div>
        </div>
      </section>

      <!-- 今日 -->
      <section class="section">
        <h2 class="sec-h">今日<span class="n">3</span></h2>
        <div class="rows">
          <div class="task">
            <button class="check" type="button" aria-label="完了にする"></button>
            <div class="task-body">
              <div class="task-title">定例ミーティングの議事録をまとめる</div>
              <div class="meta"><span><i class="swatch" style="--c:var(--dim)"></i>仕事</span></div>
            </div>
          </div>
          <div class="task">
            <button class="check" type="button" aria-label="完了にする"></button>
            <div class="task-body">
              <div class="task-title">牛乳と卵を買う</div>
              <div class="meta"><span><i class="swatch" style="--c:var(--green)"></i>買い物</span></div>
            </div>
          </div>
          <div class="task">
            <button class="check" type="button" aria-label="完了にする"></button>
            <div class="task-body">
              <div class="task-title">読みたい本をメモする</div>
              <div class="meta"><span>インボックス</span></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 完了(畳める) -->
      <section class="section">
        <button class="toggle" type="button" aria-expanded="true"><svg class="pxi" width="14" height="8" viewBox="0 0 7 4" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h7v1h-7zM1 1h5v1h-5zM2 2h3v1h-3zM3 3h1v1h-1z"/></svg>完了 <span class="n">1</span></button>
        <div class="rows">
          <div class="task is-done">
            <button class="check is-done" type="button" aria-label="未完了に戻す"></button>
            <div class="task-body">
              <div class="task-title">会議室を予約する</div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- 詳細パネル -->
  <aside class="panel window" aria-label="タスク詳細">
    <div class="panel-head">
      <span class="crumb"><i class="swatch" style="--c:var(--dim)"></i>仕事</span>
      <button class="icon-btn" type="button" aria-label="閉じる"><svg class="pxi" width="14" height="14" viewBox="0 0 7 7" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h1v1h-1zM6 0h1v1h-1zM0 1h2v1h-2zM5 1h2v1h-2zM1 2h2v1h-2zM4 2h2v1h-2zM2 3h3v1h-3zM1 4h2v1h-2zM4 4h2v1h-2zM0 5h2v1h-2zM5 5h2v1h-2zM0 6h1v1h-1zM6 6h1v1h-1z"/></svg></button>
    </div>
    <div class="panel-body">
      <div class="title-wrap">
        <button class="check is-high" type="button" aria-label="完了にする"></button>
        <h2>請求書を送る</h2>
      </div>

      <dl class="props">
        <dt>期限</dt>
        <dd><span class="due"><svg class="pxi" width="14" height="14" viewBox="0 0 7 7" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h1v1h-1zM5 0h1v1h-1zM0 1h7v1h-7zM0 2h7v1h-7zM0 3h1v1h-1zM6 3h1v1h-1zM0 4h1v1h-1zM2 4h1v1h-1zM4 4h1v1h-1zM6 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM0 6h7v1h-7z"/></svg>11/16(月)・期限切れ</span></dd>
        <dt>優先度</dt>
        <dd class="seg prio">
          <button type="button" aria-pressed="true" class="is-high">高</button>
          <button type="button" aria-pressed="false">中</button>
          <button type="button" aria-pressed="false">低</button>
        </dd>
        <dt>リスト</dt>
        <dd>
          <button class="btn btn-sub select-btn" type="button"><i class="swatch" style="--c:var(--dim)"></i>仕事<svg class="pxi" width="14" height="8" viewBox="0 0 7 4" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h7v1h-7zM1 1h5v1h-5zM2 2h3v1h-3zM3 3h1v1h-1z"/></svg></button>
        </dd>
      </dl>

      <label class="memo-label" for="memo">メモ</label>
      <textarea class="memo" id="memo" rows="5" maxlength="1000">先月分。PDFにして経理へ</textarea>
      <div class="counter n">13 / 1000</div>
    </div>
    <div class="panel-foot">
      <span class="saved"><svg class="pxi" width="14" height="12" viewBox="0 0 7 6" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M6 0h1v1h-1zM5 1h2v1h-2zM0 2h1v1h-1zM4 2h2v1h-2zM0 3h2v1h-2zM3 3h2v1h-2zM1 4h3v1h-3zM2 5h1v1h-1z"/></svg>保存しました・11/15 作成</span>
      <button class="btn btn-danger" type="button"><svg class="pxi" width="18" height="18" viewBox="0 0 9 9" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M3 0h3v1h-3zM0 1h9v1h-9zM1 3h7v1h-7zM1 4h1v1h-1zM3 4h1v1h-1zM5 4h1v1h-1zM7 4h1v1h-1zM1 5h1v1h-1zM3 5h1v1h-1zM5 5h1v1h-1zM7 5h1v1h-1zM1 6h1v1h-1zM3 6h1v1h-1zM5 6h1v1h-1zM7 6h1v1h-1zM1 7h1v1h-1zM3 7h1v1h-1zM5 7h1v1h-1zM7 7h1v1h-1zM1 8h7v1h-7z"/></svg>削除</button>
    </div>
  </aside>
</div>
</body>
</html>
